<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Population Projection Calculator</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 700px; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input { padding: 0.5rem; margin-top: 0.3rem; width: 100%; max-width: 300px; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.5rem; }
    #results { margin-top: 2rem; background: #f0f0f0; padding: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>📈 Population Projection Calculator</h2>

  <label for="basePop">Current Population</label>
  <input type="number" id="basePop" placeholder="e.g., 520000">

  <label for="growth">Annual Growth Rate (%)</label>
  <input type="number" id="growth" placeholder="e.g., 1.85" step="0.01">

  <label for="years">Number of Years to Project</label>
  <input type="number" id="years" placeholder="e.g., 5">

  <button onclick="calculate()">Calculate</button>

  <div id="results"></div>

<script>
function calculate() {
  const basePop = parseFloat(document.getElementById("basePop").value);
  const growth = parseFloat(document.getElementById("growth").value) / 100;
  const years = parseInt(document.getElementById("years").value);

  if ([basePop, growth, years].some(isNaN)) {
    alert("Please enter all values.");
    return;
  }

  const projected = basePop * Math.pow(1 + growth, years);

  document.getElementById("results").innerHTML = `
    <h3>📊 Projected Population</h3>
    <p><strong>Year ${years} Projection:</strong> ${Math.round(projected).toLocaleString()}</p>
  `;
}
</script>
</body>
</html>
