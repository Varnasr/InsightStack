name: Generate CHANGELOG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate CHANGELOG
        uses: heinrichreimer/github-changelog-generator-action@v2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: CHANGELOG.md