name: Build Smart Changelog

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  build_changelog:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧠 Generate changelog from commit diffs or PRs
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: .github/changelog-templates/config.json
          outputFile: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Commit updated CHANGELOG.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update CHANGELOG.md"
          file_pattern: CHANGELOG.md
