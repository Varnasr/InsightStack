name: Tests

# These suites exist to be run. Before this workflow they were not: the
# repository had no CI at all while carrying 120 checks across four suites in
# two languages, which reads as assurance without being any.
#
# Pull requests and pushes to main only. No schedule: nothing here reaches an
# external service, so there is nothing that can rot between commits, and the
# maintenance policy is against workflows that demand attention on a quiet day.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyreadstat networkx statsmodels scipy openpyxl

      # No survey data ships or can. Each folder builds seeded synthetic files
      # carrying the structure and nobody's data.
      - name: DHS South Asia
        working-directory: data_starters/dhs-south-asia
        run: |
          python make_fixture.py --outdir fixtures
          python test_load_dhs.py

      - name: PLFS India
        working-directory: data_starters/plfs-india
        run: |
          python make_fixture.py --outdir fixtures
          python test_load_plfs.py

      # Sample data ships for this one: 50 synthetic self-help group members,
      # no real respondents, so there is nothing to build first.
      - name: Network effects
        run: python -m network_effects_sni.test_network_effects

      - name: Data validation
        run: python data_validation/test_data_validation.py

      - name: Label variables
        run: python label_variables/test_label_variables.py

      - name: Survey to codebook
        run: python survey_to_codebook/test_survey_to_codebook.py

      # Runs the package end to end in a temporary copy, corrupts a value, and
      # checks that verification fails. The R cross-check runs in the R job.
      - name: Replication
        run: python replication/test_replication.py

  r:
    name: R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: install.packages(c("haven", "survey", "readr"))
        shell: Rscript {0}

      # The R suites read the same fixtures the Python ones do, which is what
      # makes "both languages return the same numbers" a check rather than a claim.
      - name: Build fixtures
        run: |
          pip install numpy pandas pyreadstat
          (cd data_starters/dhs-south-asia && python make_fixture.py --outdir fixtures)
          (cd data_starters/plfs-india && python make_fixture.py --outdir fixtures)

      - name: DHS South Asia
        working-directory: data_starters/dhs-south-asia
        run: Rscript test_load_dhs.R

      - name: PLFS India
        working-directory: data_starters/plfs-india
        run: Rscript test_load_plfs.R

      - name: Sample data
        working-directory: tests
        run: Rscript test_dummy_population.R

      # The replication package fits the same model in both languages and
      # run_all.py fails if the point estimates differ at six places.
      - name: Replication, Python against R
        run: |
          pip install statsmodels scipy
          Rscript replication/run_regression.R
          python replication/run_all.py
